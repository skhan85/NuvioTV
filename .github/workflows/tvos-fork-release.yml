name: tvOS Fork Release

# Builds an unsigned NuvioTV (Apple TV) IPA from youngchris29-art/NuvioMobile's
# tvos-shared-extraction branch with the patches in /tvos-patches applied, and publishes it
# as a GitHub release (picked up by the Raspberry Pi release watcher). Checks hourly, so a new
# push to that branch is rebuilt within about an hour. A change to /tvos-patches or this file
# also triggers a rebuild.

on:
  workflow_dispatch:
    inputs:
      force:
        description: Build even if a release for this source/fork commit already exists
        type: boolean
        default: false
  schedule:
    - cron: "53 * * * *" # hourly
  push:
    paths:
      - "tvos-patches/**"
      - ".github/workflows/tvos-fork-release.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: tvos-fork-release
  cancel-in-progress: false

env:
  SOURCE_REPO: youngchris29-art/NuvioMobile
  SOURCE_BRANCH: tvos-shared-extraction

jobs:
  prepare:
    name: Check source and decide
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      source_sha: ${{ steps.decide.outputs.source_sha }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out this repo
        uses: actions/checkout@v6

      # GitHub pauses scheduled workflows in repos with no commits for 60 days. This fork
      # otherwise never changes, so push an empty commit every ~45 days (it touches no watched
      # path, so it does not trigger a build).
      - name: Keep scheduled checks alive
        if: github.event_name == 'schedule'
        run: |
          last="$(git log -1 --format=%ct)"
          if (( $(date +%s) - last > 45 * 86400 )); then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: keep scheduled release checks enabled"
            git push
          fi

      - name: Check out tvOS source (version file only)
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_BRANCH }}
          path: src
          sparse-checkout: iosApp/Configuration

      - name: Decide whether to build
        id: decide
        run: |
          version="$(sed -n 's/^MARKETING_VERSION=//p' src/iosApp/Configuration/Version.xcconfig | tr -d '[:space:]')"
          source_sha="$(git -C src rev-parse HEAD)"
          # Fingerprint of what this fork adds, so a patch or build change rebuilds but an
          # unrelated commit (like the keepalive) does not.
          fork_hash="$(cat tvos-patches/*.patch tvos-patches/BASE .github/workflows/tvos-fork-release.yml | sha256sum | cut -c1-7)"
          tag="tvos-v${version}-fork.$(git -C src rev-parse --short=7 HEAD).${fork_hash}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
             && [[ "${{ inputs.force }}" != "true" ]]; then
            echo "Release ${tag} already exists; nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Will build ${tag}."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build unsigned tvOS IPA
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 120
    env:
      # The Xcode Kotlin phase defaults these to Mac-desktop sizes when unset; keep them runner-sized.
      GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g
      KOTLIN_DAEMON_JVMARGS: -Xmx3g
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out this repo (scaffolding + patches)
        uses: actions/checkout@v6
        with:
          path: fork

      - name: Check out tvOS source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: src
          fetch-depth: 0

      # The patches were made against the commit in tvos-patches/BASE. Each one is committed on top of
      # that commit (where it always applies), then the stack is rebased onto the commit being
      # built, so git merges them with real three-way merges instead of failing on shifted lines.
      # A patch upstream has since adopted drops out by itself. A real conflict cancels the run
      # (no failure email); the scheduled patch-update task resolves it and pushes new patches.
      - name: Apply fork patches
        id: apply
        working-directory: src
        run: |
          set -uo pipefail
          shopt -s nullglob
          git config user.name "fork-ci"; git config user.email "fork-ci@users.noreply.github.com"
          # Both upstream and the patches add strings at the end of strings.xml; keep both sides.
          mkdir -p "$(git rev-parse --git-dir)/info"
          echo '**/strings.xml merge=union' >> "$(git rev-parse --git-path info/attributes)"
          target="$(git rev-parse HEAD)"
          base="$(tr -d '[:space:]' < "../fork/tvos-patches/BASE" 2>/dev/null || true)"
          if [[ -z "${base}" ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::warning::tvos-patches/BASE is missing or unknown; applying the patches directly."
            base="${target}"
          fi
          git checkout -q -B patched "${base}"
          for patch in ../fork/tvos-patches/*.patch; do
            name="$(basename "${patch}")"
            if ! git apply --index "${patch}"; then
              echo "::error::${name} does not apply to its own base ${base::10}; tvos-patches/BASE is out of date."
              exit 1
            fi
            git commit -q --allow-empty -m "${name}"
          done
          if [[ "${base}" != "${target}" ]]; then
            if git rebase -q --empty=drop --onto "${target}" "${base}" patched; then
              echo "Rebased the patches from ${base::10} onto ${target::10}."
              git log --format='  %s' "${target}..patched"
            else
              conflict="$(git log -1 --format=%s REBASE_HEAD 2>/dev/null || echo unknown)"
              files="$(git diff --name-only --diff-filter=U | tr '\n' ' ')"
              git rebase --abort
              echo "::warning::${conflict} conflicts with the new source (${files}). Waiting for the patch-update task; cancelling this run."
              {
                echo "### Patches need updating"
                echo "\`${conflict}\` conflicts with ${target::10} in: ${files}"
                echo "The scheduled patch-update task will rebase the patches and push them; the next run then builds."
              } >> "${GITHUB_STEP_SUMMARY}"
              gh run cancel "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}"
              sleep 120
              exit 1
            fi
          fi
          # Build from the patched tree, as plain uncommitted changes on the target commit.
          git reset -q --soft "${target}"

      # Only MPVKit: the source carries other gitlinks with no .gitmodules URL.
      - name: Init MPVKit submodule
        working-directory: src
        run: git submodule update --init MPVKit

      - name: Write runtime config
        env:
          # Official Nuvio server, as shipped in the public NuvioTV builds.
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL || 'https://api.nuvio.tv' }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY || 'sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN' }}
          # Public feature endpoints (skip-intro, IMDb episode ratings).
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL || 'https://api.introdb.app' }}
          IMDB_RATINGS_API_BASE_URL: ${{ secrets.IMDB_RATINGS_API_BASE_URL || 'https://seriesgraph.com/' }}
          IMDB_TAPFRAME_API_BASE_URL: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL || 'https://imdb.tapframe.space/' }}
          # Optional tracker/debrid app IDs from repository secrets.
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          PREMIUMIZE_CLIENT_ID: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          # MDBList sign-in (device code); free app at mdblist.com/developer. Blank = MDBList off.
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID || '63lxs5y12mtmidz76v8s06q6s' }}
          # The source bundles the TMDB key at build time (no Settings entry since upstream
          # 60ee0160); without it TMDB enrichment is off.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          : > src/local.properties
          for key in NUVIO_SUPABASE_URL NUVIO_SUPABASE_ANON_KEY INTRODB_API_URL \
                     IMDB_RATINGS_API_BASE_URL IMDB_TAPFRAME_API_BASE_URL \
                     SIMKL_CLIENT_ID TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET PREMIUMIZE_CLIENT_ID \
                     MDBLIST_CLIENT_ID TMDB_API_KEY; do
            value="${!key}"
            if [[ -n "${value}" ]]; then
              printf '%s=%s\n' "${key}" "${value}" >> src/local.properties
              echo "Set ${key}"
            else
              echo "Skipped ${key} (no secret)"
            fi
          done

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle and Kotlin Native
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: tvos-gradle-konan-${{ runner.os }}-${{ hashFiles('src/gradle/libs.versions.toml', 'src/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: tvos-gradle-konan-${{ runner.os }}-

      # :shared's tvOS build needs a patched quickjs-kt published to mavenLocal.
      - name: Cache quickjs-kt tvOS build
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/io/github/dokar3
          key: quickjs-tvos-${{ hashFiles('fork/scaffolding/quickjs-kt-tvos.patch', 'fork/scaffolding/build-quickjs-tvos.sh') }}

      - name: Publish quickjs-kt 1.0.5-tvos to mavenLocal
        run: |
          if [ -d "$HOME/.m2/repository/io/github/dokar3/quickjs-kt/1.0.5-tvos" ]; then
            echo "quickjs-kt 1.0.5-tvos already in mavenLocal (cache hit)"
            exit 0
          fi
          bash fork/scaffolding/build-quickjs-tvos.sh "$HOME/quickjs-kt-tvos"

      # Same Gradle task the Xcode phase runs, isolated so a Kotlin error is easy to find.
      - name: Link shared Kotlin framework (tvOS device, Release)
        working-directory: src
        run: ./gradlew :shared:linkReleaseFrameworkTvosArm64 --no-daemon --stacktrace

      - name: Build NuvioTV (Release, unsigned, tvOS device)
        working-directory: src
        run: |
          set -o pipefail
          if ! xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme NuvioTV \
            -configuration Release \
            -destination "generic/platform=tvOS" \
            -derivedDataPath build/tvos-ipa \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            NUVIO_BETA_TAG="${TAG}" 2>&1 | tee xcodebuild.log; then
            # Surface compile errors as annotations, readable without downloading the full log.
            grep -E "error: " xcodebuild.log | sort -u | head -40 | sed -e 's/%/%25/g' -e 's/^/::error::/' || true
            exit 1
          fi

      - name: Package IPA
        working-directory: src/build/tvos-ipa/Build/Products/Release-appletvos
        run: |
          [[ -d NuvioTV.app ]] || { echo "::error::NuvioTV.app was not produced."; ls -la; exit 1; }
          rm -rf Payload
          mkdir Payload
          cp -R NuvioTV.app Payload/
          # Free-Apple-ID re-signers (Sideloadly/atvloadly) break the Top Shelf extension's
          # signature, so it is removed, as in the official NuvioTV builds.
          rm -rf Payload/NuvioTV.app/PlugIns
          zip -qry "${GITHUB_WORKSPACE}/NuvioTV-${VERSION}-fork.ipa" Payload
          ls -la "${GITHUB_WORKSPACE}/NuvioTV-${VERSION}-fork.ipa"

      # Branches other than main only test that the patches still build; their IPA is kept as a
      # run artifact instead of a release, so the Raspberry Pi never installs a test build.
      - name: Keep test build as an artifact
        if: github.ref_name != 'main'
        uses: actions/upload-artifact@v4
        with:
          name: test-ipa
          path: NuvioTV-*-fork.ipa
          retention-days: 7

      - name: Publish release
        if: github.ref_name == 'main'
        run: |
          notes="NuvioTV built from ${SOURCE_REPO}@${{ needs.prepare.outputs.source_sha }} (${SOURCE_BRANCH}) with fork patches:"
          for patch in fork/tvos-patches/*.patch; do notes+=$'\n'"- $(basename "${patch}")"; done
          gh release create "${TAG}" "NuvioTV-${VERSION}-fork.ipa" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${{ github.ref_name }}" \
            --title "NuvioTV ${VERSION} (fork)" \
            --notes "${notes}" \
            || gh release upload "${TAG}" "NuvioTV-${VERSION}-fork.ipa" --clobber --repo "${GITHUB_REPOSITORY}"
